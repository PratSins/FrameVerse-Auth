name: Deploy FrameVerse-Auth to GKE

on:
  release:
    types: [published]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER || vars.GKE_CLUSTER || 'frameverse-cluster' }}
  GKE_ZONE: ${{ secrets.GKE_ZONE || vars.GKE_ZONE || 'asia-south1-a' }}
  GAR_LOCATION: ${{ secrets.GAR_LOCATION || vars.GAR_LOCATION || 'asia-south1' }}
  REPOSITORY: ${{ secrets.GAR_REPOSITORY || vars.GAR_REPOSITORY || 'cloud-run-source-deploy' }}
  IMAGE: frameverse-auth

jobs:
  deploy:
    name: Build & Deploy to GKE
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "gke-gcloud-auth-plugin"

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}"
          LATEST_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest"

          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" .
          docker push "$IMAGE_TAG"
          docker push "$LATEST_TAG"

      - name: Connect to GKE Cluster
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Deploy to GKE
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_USER: ${{ secrets.DB_USER || 'frameverse_app' }}
          DB_NAME: ${{ secrets.DB_NAME || 'frameverse_auth' }}
          DB_PORT: ${{ secrets.DB_PORT || '5432' }}
        run: |
          # 1. Resolve PostgreSQL connection string
          AUTH_DB_URL="$DATABASE_URL"
          if [ -z "$AUTH_DB_URL" ]; then
            if [ -n "$DB_HOST" ] && [ -n "$DB_PASSWORD" ]; then
              AUTH_DB_URL="postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=disable"
            else
              echo "::error::Neither DATABASE_URL nor (DB_HOST and DB_PASSWORD) secrets are set."
              exit 1
            fi
          fi

          # Update or create the PostgreSQL connection secret
          kubectl create secret generic frameverse-auth-secret \
            --from-literal=database-url="$AUTH_DB_URL" \
            --dry-run=client -o yaml | kubectl apply -f -

          # 2. Update deployment manifest with newly built image tag
          IMAGE_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}"
          sed -i "s|image: .*|image: ${IMAGE_TAG}|g" k8s/deployment.yaml

          # 3. Apply deployment and service manifests
          kubectl apply -f k8s/deployment.yaml

          # 4. Wait for rollout to complete
          kubectl rollout status deployment/frameverse-auth --timeout=180s

      - name: Verify ClusterIP Service & Show Internal Status
        run: |
          echo "=========================================================="
          echo "FrameVerse-Auth deployed successfully to GKE as ClusterIP!"
          kubectl get svc frameverse-auth
          echo "Internal DNS: http://frameverse-auth.default.svc.cluster.local:8080"
          echo "Public Access: Handled via NGINX Ingress at /api/v1/auth"
          echo "=========================================================="
